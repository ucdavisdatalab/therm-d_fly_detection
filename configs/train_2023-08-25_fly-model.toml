# Model Training Configuration
# ----------------------------
# Ignore this file unless you want to train the fly detection model.
#
# This configuration was used to train the fly models saved as
# `pytorch_fly-model.tar.gz` in the Google Drive. The best model was also
# converted to the `2023-08-25_fly-detection.onnx` file.
name = "fly-model"

[assemble]
data_dir = "outputs/"
datasets = [
    "2023-07-12_biden"
  , "2023-07-19_biden"
  , "2023-07-19_shiny"
  , "2023-07-22_shiny"
  , "2023-07-23_skywalker"
  , "2023-07-26_shiny"
  , "2023-08-09_biden"
]
test_size = 0.2
seed = 1931
#out_dir = "outputs/training"

[train]
pretrain_path = "models/yolov8x.pt"
data_path = "outputs/fly-model/fly-model.yaml"
epochs = 200
patience = 20
